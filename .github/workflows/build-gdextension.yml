name: Build GDExtension (all platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for auto: vYYYY.MM.DD.run)"
        required: false
        default: ""
      cefglue_tag:
        description: "CefGlue release tag (e.g. v149.7827.156)"
        required: true
        default: "v149.7827.156"
      cef_version:
        description: "CEF runtime version for cef.redist (e.g. 149.0.4)"
        required: true
        default: "149.0.4"

env:
  DOTNET_VERSION: "10.0.x"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux-x64
          - os: macos-latest
            rid: osx-arm64
            platform: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Install NativeAOT prerequisites
      - name: Install AOT prerequisites (Linux)
        if: ${{ matrix.platform == 'linux-x64' }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Setup MSVC (Windows AOT)
        if: ${{ matrix.platform == 'windows-x64' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Debug - show architecture (macOS)
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: |
          echo "uname -m: $(uname -m)"
          echo "dotnet --info:" && dotnet --info | head -20

      # CefGlue packages from youfch/CefGlue GitHub Releases
      - name: Download CefGlue packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          mkdir -p _nuget-feed
          gh release download "${{ github.event.inputs.cefglue_tag }}" `
            --repo youfch/CefGlue `
            --dir _nuget-feed `
            --pattern "*.nupkg"
          dotnet nuget add source "$PWD/_nuget-feed" --name local-cefglue

      # cef.redist packages for all platforms (csproj references all of them)
      - name: Download cef.redist packages
        shell: pwsh
        run: |
          $VER = "${{ github.event.inputs.cef_version }}"
          # Linux
          foreach ($pkg in @("linux64", "linuxarm64")) {
            $URL = "https://github.com/youfch/cef.redist.linux/releases/download/v${VER}/cef.redist.${pkg}.${VER}.nupkg"
            Write-Host "Downloading: $URL"
            $null = curl -L -f -o "_nuget-feed/cef.redist.${pkg}.${VER}.nupkg" "$URL" 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Failed: $URL" }
          }
          # macOS
          foreach ($pkg in @("osx64", "osxarm64")) {
            $URL = "https://github.com/youfch/cef.redist.osx/releases/download/v${VER}/cef.redist.${pkg}.${VER}.nupkg"
            Write-Host "Downloading: $URL"
            $null = curl -L -f -o "_nuget-feed/cef.redist.${pkg}.${VER}.nupkg" "$URL" 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Failed: $URL" }
          }

      - name: Restore
        run: dotnet restore extension/GDCefGlueExtension.csproj -r ${{ matrix.rid }}

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          dotnet publish extension/GDCefGlueExtension.csproj `
            -c Release -r ${{ matrix.rid }} -p:PublishAot=true `
            -o "extension/bin/Release/net10.0/${{ matrix.rid }}/publish"

      - name: Assemble package
        shell: pwsh
        run: |
          $PUB = "extension/bin/Release/net10.0/${{ matrix.rid }}/publish"
          if (-not (Test-Path $PUB)) { Write-Host "::error::Publish output not found: $PUB"; exit 1 }
          $OUT = "addons/gdcefglue/${{ matrix.platform }}"
          $NULL = New-Item -ItemType Directory -Force -Path "$OUT/CefGlueBrowserProcess"

          # Copy everything from publish output (GDExtension lib + CEF files already copied by MSBuild targets)
          Copy-Item "$PUB/*" "$OUT/" -Force -Recurse -Exclude "*.pdb", "*.xml", "*.dbg"
          # Remove runtimes/ — only locales/ is needed from CEF redist
          if (Test-Path "$OUT/runtimes") { Remove-Item -Recurse -Force "$OUT/runtimes"; Write-Host "  removed runtimes/" }
          Get-ChildItem "$OUT" -Name | ForEach-Object { Write-Host "  $_" }

          # BrowserProcess needs to be in a subdirectory
          $BP_FILE = if ("${{ matrix.platform }}" -eq "windows-x64") { "Xilium.CefGlue.BrowserProcess.exe" } else { "Xilium.CefGlue.BrowserProcess" }
          $BP_SRC = "$PUB/$BP_FILE"
          if (Test-Path $BP_SRC) {
            Move-Item $BP_SRC "$OUT/CefGlueBrowserProcess/$BP_FILE" -Force
            if ("${{ matrix.platform }}" -ne "windows-x64") { chmod +x "$OUT/CefGlueBrowserProcess/$BP_FILE" }
            Write-Host "  moved BrowserProcess to CefGlueBrowserProcess/"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdcefglue-${{ matrix.platform }}
          path: addons/gdcefglue/${{ matrix.platform }}/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
            echo "gdextension_archive=gdcefglue-gdextension-v${VER}.zip" >> $GITHUB_OUTPUT
            echo "plugin_archive=gdcefglue-plugin-v${VER}.zip" >> $GITHUB_OUTPUT
          else
            DATE=$(date +'%Y.%m.%d')
            VER="v${DATE}.${{ github.run_number }}"
            echo "tag=$VER" >> $GITHUB_OUTPUT
            echo "gdextension_archive=gdcefglue-gdextension-${VER}.zip" >> $GITHUB_OUTPUT
            echo "plugin_archive=gdcefglue-plugin-${VER}.zip" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Merge into addons/gdcefglue/
        run: |
          mkdir -p addons/gdcefglue
          for dir in _artifacts/gdcefglue-*/; do
            [ -d "$dir" ] || continue
            platform=$(basename "$dir" | sed 's/^gdcefglue-//')
            mkdir -p "addons/gdcefglue/$platform"
            cp -r "$dir"/* "addons/gdcefglue/$platform/"
            echo "  $platform: $(find "$dir" -type f | wc -l) files"
          done
          echo "=== Package structure ==="
          find addons/gdcefglue -type f | sort

      - name: Generate gdcefglue.gdextension
        run: |
          cat > addons/gdcefglue/gdcefglue.gdextension << 'GEXT'
[configuration]
entry_symbol = "gdcefglue_library_init"
compatibility_minimum = 4.6

[libraries]
windows.x86_64.debug = "res://addons/gdcefglue/windows-x64/GDCefGlueExtension.dll"
windows.x86_64.release = "res://addons/gdcefglue/windows-x64/GDCefGlueExtension.dll"
linux.x86_64.debug = "res://addons/gdcefglue/linux-x64/GDCefGlueExtension.so"
linux.x86_64.release = "res://addons/gdcefglue/linux-x64/GDCefGlueExtension.so"
macos.debug = "res://addons/gdcefglue/macos-arm64/GDCefGlueExtension.dylib"
macos.release = "res://addons/gdcefglue/macos-arm64/GDCefGlueExtension.dylib"
GEXT

      - name: Create GDExtension archive
        run: |
          zip -r ${{ steps.version.outputs.gdextension_archive }} addons/gdcefglue/
          echo "GDExtension archive: ${{ steps.version.outputs.gdextension_archive }}"

      - name: Create Plugin archive
        run: |
          cd plugin
          zip -r ../${{ steps.version.outputs.plugin_archive }} addons/GCefGlue/
          echo "Plugin archive: ${{ steps.version.outputs.plugin_archive }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --title "GDCefGlue ${{ steps.version.outputs.tag }}" \
            --notes "See [README](https://github.com/${{ github.repository }}) for usage." \
            ${{ steps.version.outputs.gdextension_archive }} \
            ${{ steps.version.outputs.plugin_archive }}