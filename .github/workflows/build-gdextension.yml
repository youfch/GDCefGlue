name: Build GDExtension (all platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty for auto: vYYYY.MM.DD.run)"
        required: false
        default: ""
      cefglue_tag:
        description: "CefGlue release tag (e.g. v149.7827.156)"
        required: true
        default: "v149.7827.156"
      cef_version:
        description: "CEF runtime version for cef.redist (e.g. 149.0.6)"
        required: true
        default: "149.0.6"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
          - os: macos-latest
            rid: osx-arm64
            platform: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Install NativeAOT prerequisites
      - name: Install AOT prerequisites (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Setup MSVC (Windows AOT)
        if: ${{ matrix.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1

      # CefGlue packages from youfch/CefGlue GitHub Releases
      - name: Download CefGlue packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          mkdir -p _nuget-feed
          gh release download "${{ github.event.inputs.cefglue_tag }}" `
            --repo youfch/CefGlue `
            --dir _nuget-feed `
            --pattern "*.nupkg"
          dotnet nuget add source "$PWD/_nuget-feed" --name local-cefglue

      # cef.redist packages for Linux/macOS from youfch's repos
      - name: Download cef.redist packages (Linux/macOS)
        if: ${{ matrix.platform != 'windows' }}
        shell: pwsh
        run: |
          $VER = "${{ github.event.inputs.cef_version }}"
          $PLATFORM = "${{ matrix.platform }}"
          if ($PLATFORM -eq "linux") {
            $REPO = "youfch/cef.redist.linux"
            $PKGS = @("linux64", "linuxarm64")
          } else {
            $REPO = "youfch/cef.redist.osx"
            $PKGS = @("osx64", "osxarm64")
          }
          foreach ($pkg in $PKGS) {
            $URL = "https://github.com/$REPO/releases/download/v${VER}/cef.redist.${pkg}.${VER}.nupkg"
            Write-Host "Downloading: $URL"
            curl -L -o "_nuget-feed/cef.redist.${pkg}.${VER}.nupkg" "$URL"
          }

      - name: Restore
        run: dotnet restore extension/GDCefGlueExtension.csproj -r ${{ matrix.rid }}

      - name: Publish (NativeAOT)
        run: >
          dotnet publish extension/GDCefGlueExtension.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Assemble package
        run: python extension/build_package.py --no-build --rid ${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdcefglue-${{ matrix.platform }}
          path: addons/gdcefglue/${{ matrix.platform }}/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "archive=gdcefglue-${{ github.event.inputs.version }}.zip" >> $GITHUB_OUTPUT
          else
            DATE=$(date +'%Y.%m.%d')
            VER="v${DATE}.${{ github.run_number }}"
            echo "tag=$VER" >> $GITHUB_OUTPUT
            echo "archive=gdcefglue-${VER}.zip" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Merge into addons/gdcefglue/
        run: |
          mkdir -p addons/gdcefglue
          for dir in _artifacts/gdcefglue-*/; do
            [ -d "$dir" ] && cp -r "$dir"/* addons/gdcefglue/
          done
          echo "=== Package structure ==="
          find addons/gdcefglue -type f | sort

      - name: Generate .gdextension
        run: python extension/build_package.py --no-build --rid win-x64 || true

      - name: Create archive
        run: |
          cd addons
          zip -r ../${{ steps.version.outputs.archive }} gdcefglue/
          echo "Archive: ${{ steps.version.outputs.archive }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --title "GDCefGlue ${{ steps.version.outputs.tag }}" \
            --notes "See [README](https://github.com/${{ github.repository }}) for usage." \
            ${{ steps.version.outputs.archive }}